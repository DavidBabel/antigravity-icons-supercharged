    <rect x="19" y="17.6" width="1" height="0.4" rx="0.2"/>
    <rect x="19" y="18.6" width="1" height="0.4" rx="0.2"/>
    <rect x="19" y="19.6" width="1" height="0.4" rx="0.2"/>
  </g>
  <g fill="#FFAF5F">
    <rect x="21.75" y="16.6" width="1" height="0.4" rx="0.2"/>
